# ============================================================================
# Fleet Platform - Docker Compose Configuration
# ============================================================================
# This compose file defines the backend microservices for local development.
# Each service runs independently and can be scaled/deployed separately.
# 
# NOTE: Kafka and TimescaleDB services are not included in this base setup.
# They will be added in the ingestion Spec when their adapters are implemented.
# ============================================================================

version: '3.9'

services:
  # --------------------------------------------------------------------------
  # Ingestion Service
  # --------------------------------------------------------------------------
  # HTTP API that receives telemetry from mobile devices and publishes to Kafka
  ingestion:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
      target: ingestion
    container_name: fleet-ingestion
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      # Ingestion-specific configuration
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_WRITE_TIMEOUT:-15s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-30s}
      # Shared logging configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # --------------------------------------------------------------------------
  # Worker Service
  # --------------------------------------------------------------------------
  # Kafka consumer that processes telemetry events and persists to TimescaleDB
  worker:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
      target: worker
    container_name: fleet-worker
    environment:
      # Worker-specific configuration
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-30s}
      # Shared logging configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    restart: unless-stopped
    depends_on:
      ingestion:
        condition: service_healthy
    # NOTE: No healthcheck for worker in base setup. Will be added when
    # Kafka consumer is implemented (can check consumer lag or last processed timestamp)

# ============================================================================
# Networks
# ============================================================================
# Default network for service-to-service communication
networks:
  default:
    name: fleet-network
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
# No volumes needed in base setup. Will be added when databases are integrated.
