# ============================================================================
# Fleet Platform - Docker Compose Configuration
# ============================================================================
# This compose file defines the complete local development environment including:
# - Backend microservices (ingestion API, worker)
# - Infrastructure services (Zookeeper, Kafka, TimescaleDB)
# 
# Quick start:
#   make up          # Start all services
#   make status      # Check service health
#   make logs        # Follow all logs
#   make down        # Stop and remove containers
# ============================================================================

version: '3.9'

services:
  # --------------------------------------------------------------------------
  # Infrastructure: Zookeeper
  # --------------------------------------------------------------------------
  # Coordination service for Kafka metadata management
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fleet-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
      LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"
      # Enable 4-letter words for health checks
      SERVER_JVMFLAGS: "-Dcom.sun.jndi.ldap.connect.pool=false"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - fleet-network
    restart: unless-stopped
    healthcheck:
      # Simple port check - if 2181 is listening, Zookeeper is ready
      test: ["CMD", "bash", "-c", "nc -z localhost 2181"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------------
  # Infrastructure: Kafka
  # --------------------------------------------------------------------------
  # Event bus for decoupled telemetry ingestion and processing
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fleet-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - fleet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------------
  # Infrastructure: TimescaleDB
  # --------------------------------------------------------------------------
  # PostgreSQL with TimescaleDB extension for time-series telemetry storage
  timescaledb:
    image: timescale/timescaledb:2.14.0-pg15
    container_name: fleet-timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_password}
      POSTGRES_DB: ${POSTGRES_DB:-fleet_db}
    ports:
      - "${TIMESCALEDB_PORT:-5433}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - fleet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fleet_user} -d $${POSTGRES_DB:-fleet_db}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------------------------
  # Ingestion Service
  # --------------------------------------------------------------------------
  # HTTP API that receives telemetry from mobile devices and publishes to Kafka
  ingestion:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
      target: ingestion
    container_name: fleet-ingestion
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      # Ingestion-specific configuration
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-30s}
      # Kafka configuration
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-telemetry.positions}
      # Shared logging configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fleet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # --------------------------------------------------------------------------
  # Worker Service
  # --------------------------------------------------------------------------
  # Kafka consumer that processes telemetry events and persists to TimescaleDB
  worker:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
      target: worker
    container_name: fleet-worker
    environment:
      # Worker-specific configuration
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-30s}
      # Kafka configuration
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-telemetry.positions}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-fleet-worker-group}
      # TimescaleDB configuration
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-fleet_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fleet_password}
      DB_NAME: ${POSTGRES_DB:-fleet_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # Shared logging configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - fleet-network
    restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================
# Bridge network for service-to-service communication
networks:
  fleet-network:
    name: fleet-network
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
# Named volumes for data persistence across container restarts
volumes:
  # Zookeeper data and transaction logs
  zookeeper-data:
    name: fleet-zookeeper-data
  zookeeper-logs:
    name: fleet-zookeeper-logs
  
  # Kafka broker data (partitions, indexes, logs)
  kafka-data:
    name: fleet-kafka-data
  
  # TimescaleDB PostgreSQL data directory
  timescaledb-data:
    name: fleet-timescaledb-data
